        - tag: ap
          value: '{#AP.NAME}'
        - tag: mac
          value: '{#AP.MAC}'
      - uuid: 8e8849a5240a45d6a2296e2613e1734c
        expression: avg(/UniFi Network Application by API/unifi.ap.retry5[{#SITE.ID},{#AP.MAC}],15m)>30
        name: 'UniFi [{#SITE.NAME}] AP {#AP.NAME}: 5 GHz TX retries are high'
        priority: WARNING
        tags:
        - tag: site
          value: '{#SITE.NAME}'
        - tag: ap
          value: '{#AP.NAME}'
        - tag: mac
          value: '{#AP.MAC}'
      - uuid: 5abb187b4b63459f9f594ce2546f5939
        expression: avg(/UniFi Network Application by API/unifi.ap.satisfaction[{#SITE.ID},{#AP.MAC}],15m)<70 and min(/UniFi
          Network Application by API/unifi.ap.satisfaction[{#SITE.ID},{#AP.MAC}],15m)>=0
        name: 'UniFi [{#SITE.NAME}] AP {#AP.NAME}: WiFi satisfaction is low'
        priority: WARNING
        tags:
        - tag: site
          value: '{#SITE.NAME}'
        - tag: ap
          value: '{#AP.NAME}'
        - tag: mac
          value: '{#AP.MAC}'
      - uuid: 8857586bb6ff425e9a86d610588ffd92
        expression: last(/UniFi Network Application by API/unifi.ap.uptime[{#SITE.ID},{#AP.MAC}])<10m and last(/UniFi Network
          Application by API/unifi.ap.status[{#SITE.ID},{#AP.MAC}])=1
        name: 'UniFi [{#SITE.NAME}] AP {#AP.NAME}: Device was recently restarted'
        priority: INFO
        manual_close: 'YES'
        tags:
        - tag: site
          value: '{#SITE.NAME}'
        - tag: ap
          value: '{#AP.NAME}'
        - tag: mac
          value: '{#AP.MAC}'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var aps = JSON.parse(value);\nvar result = [];\n\nfor (var i = 0; i < aps.length; i++) {\n    var ap = aps[i];\n\
          \n    result.push({\n        \"{#AP.NAME}\": ap.name || ap.mac,\n        \"{#AP.MAC}\": ap.mac || \"\",\n      \
          \  \"{#AP.MODEL}\": ap.model || \"\",\n        \"{#AP.IP}\": ap.ip || \"\",\n        \"{#SITE.ID}\": ap.zbx_site_id\
          \ || \"\",\n        \"{#SITE.NAME}\": ap.zbx_site_name || ap.zbx_site_id || \"\"\n    });\n}\n\nreturn JSON.stringify(result);"
      master_item:
        key: unifi.aps.raw
    macros:
    - macro: '{$UNIFI.URL}'
      value: https://127.0.0.1:8443
      description: UniFi Network Application base URL, without trailing slash.
    - macro: '{$UNIFI.USER}'
      value: zabbix-monitor
      description: Local UniFi read-only monitoring user.
    - macro: '{$UNIFI.PASSWORD}'
      type: SECRET_TEXT
      description: Password for the UniFi monitoring user.
