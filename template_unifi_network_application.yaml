zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: b17730e2dea8487cb35a3af18a59aa2c
    name: Templates/Network devices
  templates:
  - uuid: 10a160f472974c7e867c2b8574cbf0fa
    template: UniFi Network Application by API
    name: UniFi Network Application by API
    description: 'UniFi Network Application standalone monitoring via local API.

      Multi-site version for Zabbix 7.0: logs in once, discovers every site visible to the

      monitoring user, retrieves all APs, and adds site-aware LLD macros, item names and

      trigger tags. Requires only URL, user and password host macros.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: d23271c2d7774a08aea753730f4ab0d8
      name: 'UniFi: Get AP data (all sites)'
      type: SCRIPT
      key: unifi.aps.raw
      delay: 1m
      history: 1d
      trends: '0'
      value_type: TEXT
      params: "var p = JSON.parse(value);\nvar req = new HttpRequest();\n\nreq.addHeader('Content-Type: application/json');\n\
        \nvar login = req.post(p.url + '/api/login', JSON.stringify({\n    username: p.user,\n    password: p.password\n}));\n\
        \nif (req.getStatus() != 200) {\n    throw 'UniFi login failed. HTTP status: ' + req.getStatus() + '; response: '\
        \ + login;\n}\n\nvar sitesRaw = req.get(p.url + '/api/self/sites');\n\nif (req.getStatus() != 200) {\n    throw 'UniFi\
        \ site query failed. HTTP status: ' + req.getStatus() + '; response: ' + sitesRaw;\n}\n\nvar sitesObj = JSON.parse(sitesRaw);\n\
        \nif (!sitesObj.meta || sitesObj.meta.rc !== 'ok' || !sitesObj.data) {\n    throw 'Unexpected UniFi sites response:\
        \ ' + sitesRaw;\n}\n\nvar result = [];\n\nfor (var i = 0; i < sitesObj.data.length; i++) {\n    var site = sitesObj.data[i];\n\
        \    var devicesRaw = req.get(p.url + '/api/s/' + encodeURIComponent(site.name) + '/stat/device');\n\n    if (req.getStatus()\
        \ != 200) {\n        throw 'UniFi device query failed for site ' + site.name +\n              '. HTTP status: ' +\
        \ req.getStatus() + '; response: ' + devicesRaw;\n    }\n\n    var devicesObj = JSON.parse(devicesRaw);\n\n    if\
        \ (!devicesObj.meta || devicesObj.meta.rc !== 'ok' || !devicesObj.data) {\n        throw 'Unexpected UniFi device\
        \ response for site ' + site.name + ': ' + devicesRaw;\n    }\n\n    for (var j = 0; j < devicesObj.data.length; j++)\
        \ {\n        var d = devicesObj.data[j];\n\n        if (d.type === 'uap') {\n            d.zbx_site_id = site.name\
        \ || '';\n            d.zbx_site_name = site.desc || site.name || '';\n            result.push(d);\n        }\n  \
        \  }\n}\n\nreturn JSON.stringify(result);"
      parameters:
      - name: password
        value: '{$UNIFI.PASSWORD}'
      - name: url
        value: '{$UNIFI.URL}'
      - name: user
        value: '{$UNIFI.USER}'
      timeout: 30s
      tags:
      - tag: component
        value: raw
    discovery_rules:
    - uuid: 9e0e0ba699d243d2a905342ab99a0f85
      name: 'UniFi: Access point discovery (all sites)'
      type: DEPENDENT
      key: unifi.ap.discovery
      delay: '0'
      lifetime: 7d
      enabled_lifetime_type: DISABLE_NEVER
      item_prototypes:
      - uuid: ba1eabfbe4444c9b9bb9f8877c386b53
        name: '[{#SITE.NAME}] AP {#AP.NAME}: Status'
        type: DEPENDENT
        key: unifi.ap.status[{#SITE.ID},{#AP.MAC}]
        delay: '0'
        history: 7d
        trends: 90d
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - "var data = JSON.parse(value);\nvar a = null;\nfor (var i = 0; i < data.length; i++) {\n    if (data[i].mac ===\
            \ \"{#AP.MAC}\" && data[i].zbx_site_id === \"{#SITE.ID}\") {\n        a = data[i];\n        break;\n    }\n}\n\
            return a ? (a.state || 0) : 0;\n"
        master_item:
          key: unifi.aps.raw
        tags:
        - tag: site
          value: '{#SITE.NAME}'
        - tag: ap
          value: '{#AP.NAME}'
      - uuid: 9daaf39cf9cc4ec0bd69fab0fa4bf9d2
        name: '[{#SITE.NAME}] AP {#AP.NAME}: IP address'
        type: DEPENDENT
        key: unifi.ap.ip[{#SITE.ID},{#AP.MAC}]
        delay: '0'
        history: 30d
        value_type: CHAR
        trends: '0'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - "var data = JSON.parse(value);\nvar a = null;\nfor (var i = 0; i < data.length; i++) {\n    if (data[i].mac ===\
            \ \"{#AP.MAC}\" && data[i].zbx_site_id === \"{#SITE.ID}\") {\n        a = data[i];\n        break;\n    }\n}\n\
            return a && a.ip ? a.ip : \"\";\n"
